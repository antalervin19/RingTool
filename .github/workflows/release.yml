name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish RingTool.csproj -c Release -o out
      - run: Compress-Archive -Path out/RingTool.exe -DestinationPath RingTool-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: RingTool-win-x64.zip
